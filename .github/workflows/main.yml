name: ci

on:
  push:
    branches:
      - '**'

  pull_request:
    branches:
      - '**'

  schedule:
    - cron: '0 0 * * *'

  workflow_dispatch:
    inputs:
      cache_number:
        description: "Increase to manually reset conda cache"
        required: false
        default: "0"

env:
  CACHE_NUMBER: ${{ github.event.inputs.cache_number || 0 }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-64
            prefix: /usr/share/miniconda3/envs/env

    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Mambaforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-variant: Miniforge3
          miniforge-version: 24.11.2-1
          activate-environment: env
          use-mamba: true

      - name: Set cache date
        run: echo "DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV

      - name: Restore conda environment cache
        id: cache
        uses: actions/cache@v3
        with:
          path: ${{ matrix.prefix }}
          key: ${{ matrix.label }}-conda-${{ hashFiles('requirements.yml') }}-${{ env.DATE }}-${{ env.CACHE_NUMBER }}

      - name: Update environment
        if: steps.cache.outputs.cache-hit != 'true'
        run: mamba env update -n env -f requirements.yml

      - name: Run tests
        shell: bash -el {0}
        run: |
          conda activate env
          python main.py --download
          python tests/test_suite.py fast
